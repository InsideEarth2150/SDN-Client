name: Build Client Proxies & Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libprotobuf-dev protobuf-compiler libssl-dev pkg-config

      - name: Build GameNetworkingSockets Library
        run: |
          git clone --recursive https://github.com/ValveSoftware/GameNetworkingSockets.git third_party_gns
          cd third_party_gns && mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DENABLE_ICE=OFF
          cmake --build . --parallel $(nproc)

      - name: Compile Linux Client Binary
        run: |
          g++ -std=c++17 -O2 src/client_proxy.cpp \
            -I./src \
            -I./third_party_gns/include \
            -L./third_party_gns/build/src \
            -lGameNetworkingSockets_s -lssl -lcrypto -lprotobuf -lpthread \
            -o gns_client_linux

      - name: Prepare Artifact Bundle
        run: |
          mkdir -p artifact_dir
          cp gns_client_linux artifact_dir/
          cp app/client_config.toml artifact_dir/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gns_client_linux
          path: artifact_dir/

  build-windows:
    name: Build Windows Client (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create vcpkg Manifest
        shell: powershell
        run: |
          $vcpkgContent = @'
          {
            "name": "gns-client-deps",
            "version": "1.0.0",
            "dependencies": [
              "protobuf",
              "openssl"
            ]
          }
          '@
          Set-Content -Path "vcpkg.json" -Value $vcpkgContent -Encoding utf8

      - name: Setup vcpkg and Binary Caching
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgJsonPath: 'vcpkg.json'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      - name: Build GameNetworkingSockets Library
        shell: cmd
        run: |
          git clone --recursive https://github.com/ValveSoftware/GameNetworkingSockets.git third_party_gns
          cd third_party_gns
          mkdir build && cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%/scripts/buildsystems/vcpkg.cmake ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DENABLE_ICE=OFF
          cmake --build . --config Release --parallel %NUMBER_OF_PROCESSORS%

      - name: Compile Windows Client Executable
        shell: cmd
        run: |
          cl.exe /EHsc /O2 /std:c++17 src/client_proxy.cpp ^
            /I.\src ^
            /I.\third_party_gns\include ^
            /I%VCPKG_ROOT%\installed\x64-windows\include ^
            .\third_party_gns\build\src\Release\GameNetworkingSockets_s.lib ^
            %VCPKG_ROOT%\installed\x64-windows\lib\protobuf.lib ^
            %VCPKG_ROOT%\installed\x64-windows\lib\ssl.lib ^
            %VCPKG_ROOT%\installed\x64-windows\lib\crypto.lib ^
            ws2_32.lib crypt32.lib advapi32.lib user32.lib shell32.lib legacy_stdio_definitions.lib ^
            /Fe:gns_client.exe

      - name: Prepare Artifact Bundle
        shell: cmd
        run: |
          mkdir artifact_dir
          copy gns_client.exe artifact_dir\
          copy app\client_config.toml artifact_dir\

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gns_client_windows
          path: artifact_dir/

  build-macos:
    name: Build macOS Client
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies via Homebrew
        run: |
          brew install cmake protobuf openssl pkg-config

      - name: Build GameNetworkingSockets Library
        run: |
          git clone --recursive https://github.com/ValveSoftware/GameNetworkingSockets.git third_party_gns
          cd third_party_gns && mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_ICE=OFF \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl)
          cmake --build . --parallel $(sysctl -n hw.ncpu)

      - name: Compile macOS Client Binary
        run: |
          clang++ -std=c++17 -O2 src/client_proxy.cpp \
            -I./src \
            -I./third_party_gns/include \
            -I$(brew --prefix openssl)/include \
            -I$(brew --prefix protobuf)/include \
            -L./third_party_gns/build/src \
            -L$(brew --prefix openssl)/lib \
            -L$(brew --prefix protobuf)/lib \
            -lGameNetworkingSockets_s -lssl -lcrypto -lprotobuf -lpthread \
            -o gns_client_mac

      - name: Prepare Artifact Bundle
        run: |
          mkdir -p artifact_dir
          cp gns_client_mac artifact_dir/
          cp app/client_config.toml artifact_dir/

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gns_client_mac
          path: artifact_dir/

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: gns_client_linux
          path: ./bin/linux/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: gns_client_windows
          path: ./bin/windows/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: gns_client_mac
          path: ./bin/macos/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./bin/linux/gns_client_linux
            ./bin/linux/client_config.toml
            ./bin/windows/gns_client.exe
            ./bin/windows/client_config.toml
            ./bin/macos/gns_client_mac
            ./bin/macos/client_config.toml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}