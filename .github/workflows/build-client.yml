name: Build Client Proxies

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libprotobuf-dev protobuf-compiler libssl-dev pkg-config

      - name: Build GameNetworkingSockets Library
        run: |
          git clone --recursive https://github.com/ValveSoftware/GameNetworkingSockets.git gns
          cd gns && mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DENABLE_ICE=OFF
          cmake --build . --parallel $(nproc)

      - name: Compile Linux Client Binary
        run: |
          g++ -std=c++17 -O2 client_proxy.cpp \
            -I./gns/include \
            -L./gns/build/lib \
            -lGameNetworkingSockets -lssl -lcrypto -lprotobuf -lpthread \
            -o gns_client

      - name: Upload Linux Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gns_client_linux
          path: gns_client

  build-windows:
    name: Build Windows Client (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild / C++ Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install vcpkg Dependencies
        run: |
          vcpkg install openssl:x64-windows-static protobuf:x64-windows-static

      - name: Build GameNetworkingSockets Library
        shell: cmd
        run: |
          git clone --recursive https://github.com/ValveSoftware/GameNetworkingSockets.git gns
          cd gns
          mkdir build && cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DENABLE_ICE=OFF ^
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build . --config Release --parallel %NUMBER_OF_PROCESSORS%

      - name: Compile Windows Client Executable
        shell: cmd
        run: |
          cl.exe /EHsc /O2 /std:c++17 client_proxy.cpp ^
            /I.\gns\include ^
            /I\vcpkg\installed\x64-windows-static\include ^
            .\gns\build\lib\Release\GameNetworkingSockets.lib ^
            \vcpkg\installed\x64-windows-static\lib\libssl.lib ^
            \vcpkg\installed\x64-windows-static\lib\libcrypto.lib ^
            \vcpkg\installed\x64-windows-static\lib\libprotobuf.lib ^
            ws2_32.lib crypt32.lib advapi32.lib user32.lib ^
            /Fe:gns_client.exe

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gns_client_windows
          path: gns_client.exe